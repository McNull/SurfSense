  redis:
    image: redis:7-alpine
    container_name: surfsense-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - surfsense-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

